name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: for f in app.js inv.js cashbook.js cheque-verification.js i18n.js config.js sw.js; do node --check "$f"; done
      - name: Shell syntax
        run: for f in scripts/backup/*.sh; do bash -n "$f"; done
      - name: Version strings agree (index.html vs sw.js)
        run: python3 scripts/check-version.py
      - name: Backup table lists agree
        run: python3 scripts/check-backup-tables.py
